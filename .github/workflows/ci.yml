name: CI - Backend Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esportcal_db
        ports:
          - 5432:5432
        # Wait until postgres is ready to accept connections
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend migrations and tests
        env:
          NODE_ENV: test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: esportcal_db
          JWT_SECRET: github_actions_secret_phrase_for_testing
          PANDASCORE_API_KEY: mock_key_for_testing
        run: |
          cd backend
          # Programmatically initialize PostgreSQL tables and migrations before running Jest
          node scripts/initTestDb.js
          npm test
