name: CI - Backend Validation

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: esportcal_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Database Migrations
        run: node scripts/initTestDb.js
        env:
          NODE_ENV: test
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: esportcal_db_test
          JWT_SECRET: test_jwt_secret_phrase_for_testing_environments
          PANDASCORE_API_KEY: mock_pandascore_api_key_for_testing

      - name: Run Backend Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          DB_USER: postgres
          DB_PASSWORD: password123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: esportcal_db_test
          JWT_SECRET: test_jwt_secret_phrase_for_testing_environments
          PANDASCORE_API_KEY: mock_pandascore_api_key_for_testing

      - name: Validate Docker Image Build
        run: |
          docker build -t esportcal-backend-ci:latest .
